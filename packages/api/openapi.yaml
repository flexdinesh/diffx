openapi: 3.1.0
info:
  title: diffx API
  version: 1.0.0
  description: Push-only diff ingestion and review API, shared by local and remote servers.
servers:
  - url: /
paths:
  /api/v2/bootstrap:
    get:
      operationId: getBootstrap
      description: Public deployment mode and current browser identity. Local mode supplies identity internally and exposes no account management.
      responses:
        "200":
          description: Deployment and browser session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/auth/login:
    post:
      operationId: login
      description: Distributed only. Password account sign-in; same-origin JSON request creating a browser session. Password accounts sign in whatever the password signup setting. Google accounts never sign in with a password, and any refusal is the same 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordCredentials"
      responses:
        "200":
          description: Authenticated browser identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/auth/signup:
    post:
      operationId: signUp
      description: Distributed only, when both signup and password signup are on (otherwise 404). Create an account with an email and password without an invite and sign it in. The email is required and stored, but is not verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSignupCredentials"
      responses:
        "200":
          description: The new account's browser identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/auth/google:
    post:
      operationId: startGoogleSignIn
      description: Distributed only, when Google sign-in is configured (otherwise 404). Start Google sign-in for an existing account, or a new one when sign-up is enabled. Sets an HttpOnly flow cookie binding the authorization to this browser; navigate to `authorizeUrl` within 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          $ref: "#/components/responses/GoogleAuthorization"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/auth/google/callback:
    get:
      operationId: completeGoogleSignIn
      description: Distributed only. Google redirects the browser here; the state and the flow cookie authenticate it, so it accepts cross-site navigation. Every outcome redirects to the app; failures add `?signin=` with `cancelled`, `no-account`, `invite-mismatch`, `invite-invalid`, `email-taken` (another account has the email) or `failed`. A Google account is identified by its subject, so a changed email keeps the account.
      parameters:
        - { in: query, name: state, required: false, schema: { type: string } }
        - { in: query, name: code, required: false, schema: { type: string } }
        - { in: query, name: error, required: false, schema: { type: string } }
      responses:
        "303":
          description: Redirect to the app, signed in on success.
          headers:
            Location:
              required: true
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/invites/lookup:
    post:
      operationId: lookupInvite
      description: Distributed only. Resolve a pending invite from its link's `#t=` secret; the page offers the sign-in methods the bootstrap reports. The secret travels in the body so it stays out of request logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteToken"
      responses:
        "200":
          description: Pending invite.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, expiresAt]
                properties:
                  email:
                    type: string
                  expiresAt:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/invites/google:
    post:
      operationId: startInviteGoogleSignIn
      description: Distributed only, when Google sign-in is configured. Start Google sign-in that accepts a pending invite. The callback creates the account only when Google reports a verified email equal to the invite's; the invite is used once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteToken"
      responses:
        "200":
          $ref: "#/components/responses/GoogleAuthorization"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/invites/password:
    post:
      operationId: acceptInviteWithPassword
      description: Distributed only, when password signup is on (otherwise 404). Accept a pending invite with the invited email and a password, and sign in. The email must match the invite and is stored, but is not verified. The invite is used once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, email, password]
              properties:
                token:
                  type: string
                  description: The secret from the invite link's `#t=` fragment.
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
      responses:
        "200":
          description: The new account's browser identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/password-reset/lookup:
    post:
      operationId: lookupPasswordReset
      description: Distributed only. Resolve a pending password reset from its link's `#t=` secret, issued from the console. The secret travels in the body so it stays out of request logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetToken"
      responses:
        "200":
          description: The account the link resets.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email]
                properties:
                  email:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/password-reset:
    post:
      operationId: completePasswordReset
      description: Distributed only. Set a new password from a reset link, which expires 24 hours after it was issued and works once. Revokes the account's browser sessions; API tokens are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                  description: The secret from the reset link's `#t=` fragment.
                password:
                  type: string
      responses:
        "204":
          description: Password changed; sign in again.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/auth/logout:
    post:
      security:
        - browserSession: []
      operationId: logout
      description: Revoke the current browser session. Requires its CSRF token.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/account/password:
    put:
      security:
        - browserSession: []
      operationId: changePassword
      description: Verify the current password, change it, and revoke all browser sessions. Password accounts' distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "204":
          description: Password changed; sign in again.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/account/tokens:
    get:
      security:
        - browserSession: []
      operationId: listAccountTokens
      description: List current account credential metadata; never returns secrets. Distributed browser sessions only.
      responses:
        "200":
          description: Tokens owned by the authenticated account.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      security:
        - browserSession: []
      operationId: createAccountToken
      description: Create a fixed collector or review API credential. The secret is returned once. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, purpose, expiresInDays]
              properties:
                name:
                  type: string
                  description: Non-empty label, at most 64 UTF-8 bytes.
                purpose:
                  type: string
                  enum: [collector, api]
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 365
      responses:
        "201":
          description: Newly created credential and its one-time secret.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, secret]
                properties:
                  token:
                    $ref: "#/components/schemas/AccountToken"
                  secret:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/account/tokens/{tokenId}:
    delete:
      security:
        - browserSession: []
      operationId: revokeAccountToken
      description: Revoke an account token immediately. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - in: path
          name: tokenId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Credential revoked.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/github/webhooks:
    post:
      operationId: receiveGitHubWebhook
      description: Distributed only, when the GitHub App integration is configured. Called by GitHub; authenticated by the X-Hub-Signature-256 HMAC, not by diffx credentials. Repeated X-GitHub-Delivery IDs are acknowledged without effect.
      parameters:
        - {
            in: header,
            name: X-GitHub-Event,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: X-GitHub-Delivery,
            required: true,
            schema: { type: string },
          }
        - {
            in: header,
            name: X-Hub-Signature-256,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Delivery applied or already applied.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/github/callback:
    get:
      operationId: completeGitHubAuthorization
      description: OAuth redirect target. Completes authorization only for the browser session that started it, then redirects to /settings with a github=connected|cancelled|failed|signin query.
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
      responses:
        "303":
          description: Redirect to settings.
  /api/v2/github/connection:
    get:
      security:
        - browserSession: []
      operationId: getGitHubConnection
      description: The account's GitHub connection. 404 when the integration is not configured. Distributed browser sessions only.
      responses:
        "200":
          description: Connection status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      security:
        - browserSession: []
      operationId: connectGitHub
      description: Start GitHub authorization for this account; navigate the browser to authorizeUrl. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Authorization started.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorizeUrl]
                properties:
                  authorizeUrl:
                    type: string
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      security:
        - browserSession: []
      operationId: disconnectGitHub
      description: Remove the account's GitHub authorization and every follow. Existing snapshots remain until retention expiry. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Disconnected.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/github/repositories:
    get:
      security:
        - browserSession: []
      operationId: listGitHubRepositories
      description: Repositories both the GitHub user and the app can read, plus followed repositories that lost access. Listing rechecks access. Distributed browser sessions only.
      responses:
        "200":
          description: Repositories.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitHubRepository"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/github/follows/{repositoryId}:
    parameters:
      - in: path
        name: repositoryId
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      security:
        - browserSession: []
      operationId: followGitHubRepository
      description: Follow a repository's pull requests after verifying access, then request a refresh of its open pull requests. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Followed.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      security:
        - browserSession: []
      operationId: unfollowGitHubRepository
      description: Stop following; existing snapshots remain until retention expiry. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Unfollowed.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      security:
        - browserSession: []
      operationId: updateGitHubFollow
      description: Change whether a followed repository's pull requests send push notifications to this account. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notify]
              properties:
                notify:
                  type: boolean
      responses:
        "204":
          description: Updated.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/push:
    get:
      security:
        - browserSession: []
      operationId: getPushSettings
      description: Web Push availability, the server's VAPID public key and this account's subscribed devices. Remote server only; distributed browser sessions only.
      responses:
        "200":
          description: Push settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSettings"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/push/subscriptions:
    put:
      security:
        - browserSession: []
      operationId: putPushSubscription
      description: Register or refresh this browser's push subscription for the account, identified by its endpoint. An endpoint registered by another account moves to this one. Idempotent. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "200":
          description: Registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDevice"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/push/subscriptions/{subscriptionId}:
    parameters:
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
    delete:
      security:
        - browserSession: []
      operationId: deletePushSubscription
      description: Stop push notifications to a device of this account. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removed.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/push/subscriptions/{subscriptionId}/test:
    parameters:
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
    post:
      security:
        - browserSession: []
      operationId: testPushSubscription
      description: Send a test notification to a device of this account and wait for the push service's answer. A device the push service reports gone is removed and answers 404. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Accepted by the push service.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/github/resync:
    post:
      security:
        - browserSession: []
      operationId: resyncGitHub
      description: Recheck access and refresh every followed repository's pull requests, including ones closed without a delivery. Resulting submissions are fresh, extending retention. Distributed browser sessions only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Refresh requested.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/health:
    get:
      operationId: getIngestionHealth
      description: Check authenticated database readiness and ingestion compatibility. State identity changes when the account database is replaced.
      responses:
        "200":
          description: Database readiness and available HTTP ingestion capabilities.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stateId, protocolVersion]
                properties:
                  stateId:
                    type: string
                  protocolVersion:
                    type: integer
                  ingestionEnabled:
                    description: Whether this runtime accepts HTTP ingestion. False for foreground local snapshots.
                    type: boolean
                  queuedIngestion:
                    type: boolean
        default:
          $ref: "#/components/responses/Problem"
  /healthz:
    get:
      operationId: getLiveness
      description: Distributed only. Unauthenticated liveness probe; answers while the process serves, without contacting the database.
      responses:
        "200":
          $ref: "#/components/responses/ProbeOk"
        default:
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadiness
      description: Distributed only. Unauthenticated readiness probe; ready while the database accepts queries. A failure never explains its cause.
      responses:
        "200":
          $ref: "#/components/responses/ProbeOk"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/ingestion-jobs:
    post:
      operationId: acceptIngestion
      description: Durably accept an immutable submission. Identical retries return the same job; changed payloads conflict. Acceptance is not publication.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Diffx-State
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionRequest"
      responses:
        "202":
          description: Durable job accepted; poll its Location until succeeded or failed.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/ingestion-jobs/{jobId}:
    get:
      operationId: getIngestionJob
      description: Owner-scoped durable job status. Cancellation of a client does not cancel accepted work.
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: X-Diffx-State
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Current job status and committed context identity when successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionJob"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/events:
    get:
      operationId: watchIngestions
      description: Server-sent ingestion notifications. Event data contains contextId; query the catalog for durable state after reconnecting.
      responses:
        "200":
          description: Server-sent events named ingestion, with JSON data containing contextId.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts:
    get:
      operationId: listContexts
      parameters:
        - name: q
          in: query
          description: Search observation metadata.
          schema:
            type: string
        - name: repository
          in: query
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
        - name: worktree
          in: query
          schema:
            type: string
        - name: hostname
          in: query
          schema:
            type: string
        - name: sourceId
          in: query
          schema:
            type: string
        - name: runId
          in: query
          schema:
            type: string
        - name: harness
          in: query
          schema:
            type: string
        - name: sessionId
          in: query
          schema:
            type: string
        - name: sessionName
          in: query
          schema:
            type: string
        - name: latest
          in: query
          description: When true, omit stale snapshots, returning each stream's current head plus observations without a stream, such as piped diffs.
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stored observations. Listing never accesses a checkout or runs Git.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    delete:
      operationId: deleteContext
      description: Permanently delete this context or snapshot, including all scopes, comments, review marks, and retained diff data. Repository files are unchanged.
      responses:
        "204":
          description: Context and its review data deleted.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getContext
      responses:
        "200":
          description: Stable review target metadata and capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Context"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/collections:
    post:
      operationId: collectCheckouts
      description: Local checkout mode only. Collects the process's selected checkout again, or discovers its selected paths again and collects every checkout and linked worktree found, ingesting each as a fresh observation. Absent when the process serves piped input, a fixture or remote storage.
      parameters:
        - name: initial
          in: query
          description: Join the background startup collection on the first live page load instead of collecting twice. Once consumed, later loads collect fresh snapshots. Explicit Sync requests omit this parameter to always collect fresh snapshots.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The contexts holding the new collections, in ingestion order, and checkouts that could not be collected. Unchanged content reuses its existing review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResult"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/metrics:
    get:
      operationId: getServerMetricsV2
      responses:
        "200":
          description: CPU and resident memory used by the Diffx server process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerMetrics"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/session:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: getSessionV2
      responses:
        "200":
          description: Active diff source and capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/diffs/current:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: getCurrentDiffV2
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Current diff snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryDiff"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/diffs/{diffId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: getDiffVersionV2
      parameters:
        - $ref: "#/components/parameters/DiffId"
        - $ref: "#/components/parameters/VersionIdPath"
      responses:
        "200":
          description: Retained immutable diff version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryDiff"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/diffs/{diffId}/files/{fileId}/patch:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: getFilePatchV2
      parameters:
        - $ref: "#/components/parameters/DiffId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/FileVersion"
      responses:
        "200":
          description: File patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePatch"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/diffs/{diffId}/files/{fileId}/contents:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: getFileContentsV2
      parameters:
        - $ref: "#/components/parameters/DiffId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/FileVersion"
      responses:
        "200":
          description: Complete before and after contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContents"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/commits:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: listCommitsV2
      description: Captured branch commits, oldest first. Empty unless the observation captured a branch comparison's commits. Commit views are read-only; comments and review marks belong to comparison scopes.
      responses:
        "200":
          description: Captured commits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/commits/{oid}/diff:
    parameters:
      - $ref: "#/components/parameters/ContextId"
      - $ref: "#/components/parameters/CommitOid"
    get:
      operationId: getCommitDiffV2
      responses:
        "200":
          description: The commit's diff against its first parent. Merge commits have none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryDiff"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/commits/{oid}/files/{fileId}/patch:
    parameters:
      - $ref: "#/components/parameters/ContextId"
      - $ref: "#/components/parameters/CommitOid"
    get:
      operationId: getCommitFilePatchV2
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/FileVersion"
      responses:
        "200":
          description: File patch within the commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePatch"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/commits/{oid}/files/{fileId}/contents:
    parameters:
      - $ref: "#/components/parameters/ContextId"
      - $ref: "#/components/parameters/CommitOid"
    get:
      operationId: getCommitFileContentsV2
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/FileVersion"
      responses:
        "200":
          description: Complete contents before and after the commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContents"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/comments:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: listCommentsV2
      responses:
        "200":
          description: All comments for the active source.
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewComment"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCommentsV2
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [all, open, resolved, outdated]
      responses:
        "200":
          description: Remaining comments after bulk deletion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [comments, deleted]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewComment"
                  deleted:
                    type: integer
                    minimum: 0
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCommentV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComment"
      responses:
        "201":
          description: Created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/comments/import:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    post:
      operationId: importCommentsV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comments]
              properties:
                comments:
                  type: array
                  items:
                    $ref: "#/components/schemas/ReviewComment"
      responses:
        "200":
          description: Idempotently imported comments.
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewComment"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/comments/export:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: exportCommentsV2
      parameters:
        - name: includeResolved
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: commentId
          in: query
          required: false
          schema:
            type: string
        - name: revision
          in: query
          required: false
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DiffMode"
      responses:
        "200":
          description: Canonical agent-ready export.
          content:
            application/xml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    patch:
      operationId: updateCommentV2
      parameters:
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComment"
      responses:
        "200":
          description: Updated comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCommentV2
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "204":
          description: Comment deleted.
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/review/comments:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: listAgentReviewCommentsV2
      parameters:
        - name: includeResolved
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Agent-ready comments with current applicability.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentReviewComment"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/review/comments/{commentId}/resolve:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    post:
      operationId: resolveAgentReviewCommentV2
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Idempotently resolved comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveReviewComment"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/comments/{commentId}/carry:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    post:
      operationId: carryComment
      description: Keep an outdated or no-longer-changed comment open as a file-level comment on this context's snapshot. The comment keeps its original code and records where it came from.
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: The carried file-level comment, placed on this snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/review-marks:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    get:
      operationId: listReviewMarksV2
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Reviewed file versions.
          content:
            application/json:
              schema:
                type: object
                required: [marks]
                properties:
                  marks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewMark"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearReviewMarksV2
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "204":
          description: Scope review marks cleared.
        default:
          $ref: "#/components/responses/Problem"
  /api/v2/contexts/{contextId}/review-marks/{fileId}:
    parameters:
      - $ref: "#/components/parameters/ContextId"
    put:
      operationId: putReviewMarkV2
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/Scope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileVersion, versionId]
              properties:
                fileVersion:
                  type: string
                versionId:
                  type: string
      responses:
        "200":
          description: Stored review mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewMark"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteReviewMarkV2
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/Scope"
      responses:
        "204":
          description: Review mark deleted.
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    browserSession:
      type: apiKey
      in: cookie
      name: diffx_session
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: false
      description: Required for unsafe requests authenticated through a distributed browser session; attached by browser identity transport. Not applicable to local or bearer credentials.
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ContextId:
      name: contextId
      in: path
      required: true
      schema:
        type: string
    Scope:
      name: scope
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/DiffMode"
    CommitOid:
      name: oid
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    DiffId:
      name: diffId
      in: path
      required: true
      schema:
        type: string
    VersionId:
      name: versionId
      in: query
      required: true
      schema:
        type: string
    VersionIdPath:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
    FileVersion:
      name: fileVersion
      in: query
      required: true
      schema:
        type: string
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProbeOk:
      description: The probe passed. Never cached.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Probe"
    GoogleAuthorization:
      description: Google authorization to navigate to.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [authorizeUrl]
            properties:
              authorizeUrl:
                type: string
  schemas:
    InviteToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The secret from the invite link's `#t=` fragment.
    ResetToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The secret from the reset link's `#t=` fragment.
    AccountUser:
      type: object
      additionalProperties: false
      required: [id, email, method]
      properties:
        id:
          type: string
        email:
          type: string
          description: The email that identifies the account, submitted at password signup or last reported by Google. A submitted email is not verified.
        method:
          type: string
          enum: [google, password]
          description: How the account signs in, fixed when it was created.
    Bootstrap:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, googleEnabled, user, csrfToken, collect, input]
          properties:
            mode:
              type: string
              enum: [local]
            googleEnabled:
              type: boolean
              enum: [false]
            user:
              type: "null"
            csrfToken:
              type: "null"
            collect:
              type: boolean
              description: Whether this process can collect its selected checkouts again through POST /api/v2/collections.
            input:
              type: string
              enum: [checkout, checkouts, capture]
              description: What this process serves. `checkout` reviews one selected checkout; `checkouts` reviews discovered checkouts and their worktrees; `capture` reviews one fixed patch (piped stdin or a fixture) and has nothing to switch to.
        - type: object
          additionalProperties: false
          required:
            [
              mode,
              googleEnabled,
              signupEnabled,
              passwordSignupEnabled,
              user,
              csrfToken,
            ]
          properties:
            mode:
              type: string
              enum: [remote]
            googleEnabled:
              type: boolean
              description: Whether people can sign in with Google.
            signupEnabled:
              type: boolean
              description: Whether people can create accounts without an invite. Admins set it in the console; invites work either way.
            passwordSignupEnabled:
              type: boolean
              description: Whether new accounts can choose a password, by signup (with signupEnabled) or invite. Admins set it in the console. Existing password accounts always sign in, reset and change their password.
            user:
              oneOf:
                - $ref: "#/components/schemas/AccountUser"
                - type: "null"
            csrfToken:
              type: [string, "null"]
    PasswordSignupCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
    PasswordCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: Account email, compared case-insensitively.
        password:
          type: string
    AccountToken:
      type: object
      additionalProperties: false
      required: [id, name, purpose, createdAt, lastUsedAt, expiresAt]
      properties:
        id:
          type: string
        name:
          type: string
        purpose:
          type: string
          enum: [collector, api]
        createdAt:
          type: integer
          description: Unix milliseconds.
        lastUsedAt:
          type: [integer, "null"]
          description: Unix milliseconds, null before first use.
        expiresAt:
          type: integer
          description: Unix milliseconds.
    Comparison:
      type: object
      description: Immutable Git comparison facts captured by the producer and stored with the observation. Defines the all and committed baselines; uncommitted compares HEAD to working changes, staged compares HEAD to index, and unstaged compares index to working tree. Missing comparison metadata retains legacy HEAD semantics.
      additionalProperties: false
      required: [kind, baseRef]
      properties:
        kind:
          type: string
          enum: [working-tree, branch]
          description: Working-tree compares HEAD to working changes. Branch compares the default or explicit base ref's merge base to the checkout, including committed and working changes; object-only branch recovery compares that merge base to HEAD.
        baseRef:
          type: string
          description: Logical comparison baseline. HEAD for working changes; normalized Git ref for branch comparisons.
        baseCommit:
          type: string
          description: Resolved baseline tip at collection time. Absent for unborn checkouts.
        mergeBase:
          type: string
          description: Full commit ID used as the all and committed scope baseline. For branch comparisons this is the merge base of baseCommit and observation.head, which may differ from the base ref tip. For working-tree comparisons it equals the captured HEAD; absent for unborn checkouts.
    AgentSession:
      type: object
      additionalProperties: false
      required: [harness, id]
      properties:
        harness:
          type: string
        id:
          type: string
        name:
          type: string
    PullRequest:
      type: object
      additionalProperties: false
      description: Hosted pull request a capture reviews. Authored only by the server's GitHub integration; public ingestion rejects it. A current stream head shows its winning submission's value, so edits and state changes appear without new content; older snapshots keep their captured value.
      required:
        [
          provider,
          repositoryId,
          fullName,
          number,
          url,
          title,
          body,
          state,
          draft,
          author,
          baseRef,
          headRef,
          headRepository,
          createdAt,
          updatedAt,
        ]
      properties:
        provider:
          type: string
          enum: [github]
        repositoryId:
          type: integer
          format: int64
          minimum: 1
        fullName:
          type: string
          description: Base repository as owner/name.
        number:
          type: integer
          minimum: 1
        url:
          type: string
          description: https://github.com/{fullName}/pull/{number}.
        title:
          type: string
        body:
          type: string
          description: Untrusted Markdown description; clients must render it without raw HTML.
        state:
          type: string
          enum: [open, closed, merged]
        draft:
          type: boolean
        author:
          type: object
          additionalProperties: false
          required: [login, url]
          properties:
            login:
              type: string
            url:
              type: string
              description: https://github.com/{login}.
        baseRef:
          type: string
        headRef:
          type: string
        headRepository:
          type: string
          description: Head repository as owner/name; differs from fullName for forks.
        createdAt:
          type: integer
          format: int64
          description: Unix milliseconds.
        updatedAt:
          type: integer
          format: int64
          description: Unix milliseconds.
    GitHubConnection:
      type: object
      additionalProperties: false
      required: [connected, installUrl]
      properties:
        connected:
          type: boolean
        login:
          type: string
        state:
          type: string
          enum: [active, revoked, expired]
          description: Revoked or expired connections must connect again; their follows receive nothing meanwhile.
        installUrl:
          type: string
          description: GitHub page for installing the app on more repositories.
    GitHubRepository:
      type: object
      additionalProperties: false
      required: [id, fullName, private, followed, lost, notify]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        private:
          type: boolean
        followed:
          type: boolean
        lost:
          type: boolean
          description: Followed but no longer readable by this account; receives nothing until access returns.
        notify:
          type: boolean
          description: Whether new pull request diffs from this followed repository send push notifications. True unless muted; false when not followed.
    PushSettings:
      type: object
      additionalProperties: false
      required: [enabled, devices]
      properties:
        enabled:
          type: boolean
          description: False when the server has no HTTPS public URL (or loopback HTTP for development).
        publicKey:
          type: string
          description: VAPID application server key, base64url uncompressed P-256 point. Present when enabled.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PushDevice"
    PushDevice:
      type: object
      additionalProperties: false
      required: [id, label, createdAt, lastSuccessAt]
      properties:
        id:
          type: string
        label:
          type: string
          description: Browser-supplied device description, for example "Chrome on Android".
        createdAt:
          type: integer
          description: Unix milliseconds.
        lastSuccessAt:
          type: [integer, "null"]
          description: Unix milliseconds of the last notification the push service accepted, null before the first.
    PushSubscriptionInput:
      type: object
      additionalProperties: false
      required: [endpoint, keys, label]
      properties:
        endpoint:
          type: string
          description: HTTPS push service endpoint from PushSubscription.toJSON().
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
        label:
          type: string
          maxLength: 120
    SessionAssociation:
      type: object
      additionalProperties: false
      required: [sourceId, harness, id, firstObservedAt, lastObservedAt]
      properties:
        sourceId:
          type: string
        harness:
          type: string
        id:
          type: string
        name:
          type: string
        firstObservedAt:
          type: integer
          format: int64
        lastObservedAt:
          type: integer
          format: int64
    ObservationMetadata:
      type: object
      additionalProperties: false
      required:
        [
          sourceId,
          hostname,
          runId,
          agent,
          trigger,
          repositoryKey,
          repositoryName,
          remoteUrl,
          checkoutKey,
          root,
          worktreeName,
          branch,
          head,
          collectedAt,
          collectorVersion,
        ]
      properties:
        sourceId:
          type: string
          description: Producer-provided source identity, independent of hostname and path.
        hostname:
          type: string
        runId:
          type: string
        agent:
          type: string
        trigger:
          type: string
        repositoryKey:
          type: string
        repositoryName:
          type: string
        remoteUrl:
          type: string
        checkoutKey:
          type: string
        linkedWorktree:
          type: boolean
          description: True for a linked Git worktree, false for the primary checkout. Omitted when unknown in older snapshots.
        root:
          type: string
          description: Source-local path; the server does not access it.
        worktreeName:
          type: string
        branch:
          type: string
        branchId:
          type: string
          description: Stable producer branch identity, preserved through branch renames. Optional for older producers and detached HEAD.
        head:
          type: [string, "null"]
        collectedAt:
          type: integer
          format: int64
          description: Producer collection time in Unix milliseconds.
        activityAt:
          type: integer
          format: int64
          minimum: 0
          description: Approximate code activity time in Unix milliseconds; omitted when unavailable. Advisory and independent of snapshot freshness.
        collectorVersion:
          type: string
        comparison:
          $ref: "#/components/schemas/Comparison"
        agentSession:
          $ref: "#/components/schemas/AgentSession"
        triggerRoot:
          type: string
          description: Directory whose manual command or agent event triggered collection; does not establish authorship.
        pullRequest:
          $ref: "#/components/schemas/PullRequest"
    IngestionScope:
      type: object
      additionalProperties: false
      required: [snapshot, patches]
      properties:
        snapshot:
          $ref: "#/components/schemas/RepositoryDiff"
        patches:
          type: object
          description: File previews keyed by snapshot file ID.
          additionalProperties:
            $ref: "#/components/schemas/FilePatch"
    Commit:
      type: object
      required:
        [oid, parents, subject, body, authorName, authoredAt, committedAt]
      properties:
        oid:
          type: string
          pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        parents:
          type: array
          description: Parent commits; merge commits have several and no captured diff.
          items:
            type: string
            pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        patchId:
          type: string
          description: Stable Git patch ID; equal across a rebase that keeps the commit's changes. Absent for merges and patches too large to identify.
        subject:
          type: string
        body:
          type: string
          description: Commit message after the subject, as plain text.
        authorName:
          type: string
        authoredAt:
          type: integer
          format: int64
          description: Unix milliseconds.
        committedAt:
          type: integer
          format: int64
          description: Unix milliseconds.
    IngestionCommit:
      allOf:
        - $ref: "#/components/schemas/Commit"
        - type: object
          properties:
            snapshot:
              $ref: "#/components/schemas/RepositoryDiff"
            patches:
              type: object
              description: File previews keyed by snapshot file ID.
              additionalProperties:
                $ref: "#/components/schemas/FilePatch"
    CommitSummary:
      allOf:
        - $ref: "#/components/schemas/Commit"
        - type: object
          required: [merge, fileCount, additions, deletions]
          properties:
            merge:
              type: boolean
            fileCount:
              type: integer
              minimum: 0
            additions:
              type: integer
              minimum: 0
            deletions:
              type: integer
              minimum: 0
    CommitList:
      type: object
      additionalProperties: false
      required: [commits, omitted]
      properties:
        commits:
          type: array
          items:
            $ref: "#/components/schemas/CommitSummary"
        omitted:
          type: integer
          minimum: 0
          description: Older commits of the range that were not captured.
    CommitRange:
      type: object
      additionalProperties: false
      required: [count, omitted]
      properties:
        count:
          type: integer
          minimum: 1
        omitted:
          type: integer
          minimum: 0
    IngestionJob:
      type: object
      additionalProperties: false
      required: [id, submissionId, state, attempt]
      properties:
        id:
          type: string
        submissionId:
          type: string
        state:
          type: string
          enum: [queued, running, retrying, succeeded, failed]
        attempt:
          type: integer
        contextId:
          type: string
        detail:
          type: string
    IngestionRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, submissionId, metadata, scopes]
      properties:
        protocolVersion:
          type: integer
          enum: [4]
          description: Protocol 4 only. Install the server before collectors that send new scopes or optional comparisonKind metadata; legacy protocol 4 submissions remain replayable.
        submissionId:
          type: string
          minLength: 1
          description: Retry identity. Reusing it with different content fails.
        contentHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Optional SHA256 of complete contents and staging state, independent of preview truncation and timestamps. Omit when complete identity cannot be proven.
        metadata:
          $ref: "#/components/schemas/ObservationMetadata"
        scopes:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/IngestionScope"
        commits:
          type: array
          maxItems: 100
          description: Optional. A branch comparison's newest commits of merge base..HEAD, oldest first, ending at the captured HEAD. Install the server before collectors that send commits.
          items:
            $ref: "#/components/schemas/IngestionCommit"
        commitsTotal:
          type: integer
          minimum: 0
          description: Commits in merge base..HEAD, including those beyond the captured 100. Required with commits.
    ContextPage:
      type: object
      additionalProperties: false
      required: [contexts, nextCursor]
      properties:
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/Context"
        nextCursor:
          type: [string, "null"]
    Context:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          name,
          root,
          locationId,
          repositoryId,
          createdAt,
          lastSubmittedAt,
          lastChangedAt,
          changedFileCount,
          expiresAt,
          submittedFrom,
          capabilities,
          availability,
          branch,
          worktreeName,
          streamId,
          latestContextId,
        ]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [observation]
        streamId:
          type: [string, "null"]
          description: Opaque stable identity of the source, repository, checkout, branch, and comparison-policy stream. Null for piped observations.
        latestContextId:
          type: [string, "null"]
          description: The stream's current head; equals id unless stale. Null when the head context expired or for piped observations.
        source:
          type: string
          enum: [local, stdin]
          description: Diff origin, independent of context kind and submission directory.
        name:
          type: string
        branch:
          type: [string, "null"]
          description: Checked-out branch, or detached HEAD label. Null for captures or unknown metadata.
        worktreeName:
          type: [string, "null"]
          description: Linked worktree directory name. Null for the main checkout or a capture.
        root:
          type: [string, "null"]
        locationId:
          type: [string, "null"]
        repositoryId:
          type: [string, "null"]
        createdAt:
          type: integer
          format: int64
        lastSubmittedAt:
          type: integer
          format: int64
        lastChangedAt:
          type: integer
          format: int64
          description: Approximate code activity in Unix milliseconds. Current heads use the winning submission activity; historical snapshots retain captured activity. Missing activity falls back to the original collection time.
        scopeSummaries:
          type: array
          description: Captured comparisons and stored file counts, independent of live checkout availability.
          items:
            $ref: "#/components/schemas/ScopeSummary"
        commits:
          $ref: "#/components/schemas/CommitRange"
          description: Captured branch commits. Absent when none were captured.
        changedFileCount:
          type: [integer, "null"]
          minimum: 0
          description: Distinct changed paths across all captured scopes, independent of the selected scope. Null when change metadata is unknown.
        expiresAt:
          type: [integer, "null"]
          format: int64
        submittedFrom:
          type: [string, "null"]
        availability:
          type: string
          enum: [unchecked, available, unavailable]
        stale:
          type: boolean
          description: A newer collection superseded this snapshot for the same owner, source, repository, checkout, branch, and comparison policy. Collection time determines freshness; arrival order breaks ties. Freshness survives snapshot expiry and pruning. False for ungrouped piped observations.
        capabilities:
          $ref: "#/components/schemas/Session/properties/capabilities"
        observation:
          $ref: "#/components/schemas/ObservationMetadata"
        sessions:
          type: array
          description: Sessions that observed this snapshot, including collections deduplicated into the same review. Names reflect latest supplied session metadata; no authorship is implied.
          items:
            $ref: "#/components/schemas/SessionAssociation"
    CollectionResult:
      type: object
      additionalProperties: false
      required: [contexts, failures, defaultContextId]
      properties:
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/Context"
        failures:
          type: array
          description: Discovered checkouts that could not be collected or ingested; their earlier snapshots remain unchanged.
          items:
            $ref: "#/components/schemas/CollectionFailure"
        defaultContextId:
          type: string
          description: The collected context that `/` and bare `/mcp` open. Changed current contexts come first; among them, the checkout containing the process's checkout path, then the most recently active.
    CollectionFailure:
      type: object
      additionalProperties: false
      required: [path, detail]
      properties:
        path:
          type: string
        detail:
          type: string
        code:
          type: string
          description: Stable failure category for this collection attempt.
        diagnosticId:
          type: string
          description: Opaque report ID retained on the producer machine for explicit CLI export.
    Probe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ServerMetrics:
      type: object
      additionalProperties: false
      required: [rssBytes, cpuUsage]
      properties:
        rssBytes:
          type: number
          minimum: 0
        cpuUsage:
          type: number
          minimum: 0
          maximum: 100
    DiffMode:
      type: string
      enum: [all, staged, unstaged, uncommitted, committed]
    DiffViewMode:
      type: string
      description: A review scope, or `commit` for a captured commit's own diff, which is never a review scope.
      enum: [all, staged, unstaged, uncommitted, committed, commit]
    ComparisonKind:
      type: string
      enum: [combined, uncommitted, staged, unstaged, committed, patch, commit]
    ScopeSummary:
      type: object
      additionalProperties: false
      required: [scope, comparisonKind, fileCount]
      properties:
        scope:
          $ref: "#/components/schemas/DiffMode"
        comparisonKind:
          $ref: "#/components/schemas/ComparisonKind"
        fileCount:
          type: integer
          minimum: 0
    CapabilityState:
      type: string
      enum: [enabled, disabled, unavailable]
    Capability:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/CapabilityState"
    ScopesCapability:
      type: object
      additionalProperties: false
      required: [state, values]
      properties:
        state:
          $ref: "#/components/schemas/CapabilityState"
        values:
          type: array
          items:
            $ref: "#/components/schemas/DiffMode"
    Session:
      type: object
      additionalProperties: false
      required:
        [id, user, locationId, repositoryId, source, name, root, capabilities]
      properties:
        id:
          type: string
        user:
          $ref: "#/components/schemas/User"
        locationId:
          type: [string, "null"]
        repositoryId:
          type: [string, "null"]
        source:
          type: string
          enum: [local, stdin]
        name:
          type: string
        root:
          type: string
        capabilities:
          type: object
          additionalProperties: false
          required: [diff, files, review]
          properties:
            diff:
              type: object
              additionalProperties: false
              required: [scopes, refresh, stagingMetadata]
              properties:
                scopes:
                  $ref: "#/components/schemas/ScopesCapability"
                refresh:
                  $ref: "#/components/schemas/Capability"
                stagingMetadata:
                  $ref: "#/components/schemas/Capability"
            files:
              type: object
              additionalProperties: false
              required: [contents]
              properties:
                contents:
                  $ref: "#/components/schemas/Capability"
            review:
              type: object
              additionalProperties: false
              required: [comments]
              properties:
                comments:
                  $ref: "#/components/schemas/Capability"
    ChangedFile:
      type: object
      additionalProperties: false
      required:
        [
          id,
          path,
          oldPath,
          status,
          indexStatus,
          worktreeStatus,
          additions,
          deletions,
          binary,
          fingerprint,
        ]
      properties:
        id:
          type: string
        path:
          type: string
        oldPath:
          type: [string, "null"]
        status:
          type: string
        indexStatus:
          type: string
        worktreeStatus:
          type: string
        additions:
          type: integer
        deletions:
          type: integer
        binary:
          type: boolean
        fingerprint:
          type: string
        recreated:
          type: boolean
    RepositoryDiff:
      type: object
      additionalProperties: false
      required:
        [
          id,
          versionId,
          locationId,
          repositoryId,
          source,
          root,
          name,
          branch,
          head,
          mode,
          files,
          revision,
        ]
      properties:
        id:
          type: string
        versionId:
          type: string
        locationId:
          type: [string, "null"]
        repositoryId:
          type: [string, "null"]
        source:
          type: string
          enum: [local, stdin]
        root:
          type: string
        name:
          type: string
        branch:
          type: string
        head:
          type: [string, "null"]
        mode:
          $ref: "#/components/schemas/DiffViewMode"
        comparisonKind:
          $ref: "#/components/schemas/ComparisonKind"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ChangedFile"
        revision:
          type: string
    FilePatch:
      type: object
      additionalProperties: false
      required: [patch, message]
      properties:
        patch:
          type: string
        message:
          type: [string, "null"]
        contents:
          $ref: "#/components/schemas/FileContents"
    FileContents:
      type: object
      additionalProperties: false
      required: [before, after]
      properties:
        before:
          type: string
        after:
          type: string
    ReviewOrigin:
      type: object
      additionalProperties: false
      required:
        [diffId, versionId, source, repository, branch, head, revision, file]
      properties:
        diffId:
          type: string
        versionId:
          type: string
        source:
          type: string
          enum: [local, stdin]
        repository:
          type: string
        branch:
          type: string
        head:
          type: [string, "null"]
        revision:
          type: string
        file:
          type: object
          additionalProperties: false
          required: [status, oldPath]
          properties:
            status:
              type: string
            oldPath:
              type: [string, "null"]
    ReviewComment:
      type: object
      additionalProperties: false
      if:
        required: [target]
        properties:
          target:
            const: file
      then:
        properties:
          side:
            const: additions
          start:
            const: 0
          end:
            const: 0
        anyOf:
          - required: [carriedFrom]
          - properties:
              code:
                const: ""
      else:
        not:
          required: [carriedFrom]
        properties:
          start:
            minimum: 1
          end:
            minimum: 1
      required:
        [
          id,
          diffId,
          versionId,
          path,
          scope,
          fingerprint,
          side,
          start,
          end,
          code,
          body,
          status,
          createdAt,
        ]
      properties:
        id:
          type: string
        diffId:
          type: string
        versionId:
          type: string
        path:
          type: string
        scope:
          $ref: "#/components/schemas/DiffMode"
        fingerprint:
          type: string
        target:
          type: string
          enum: [file, lines]
          description: Omitted means a line comment. File comments use additions, zero start/end, and empty code unless carried from an earlier line selection.
        side:
          type: string
          enum: [additions, deletions]
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        code:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [open, resolved]
        createdAt:
          type: number
        origin:
          $ref: "#/components/schemas/ReviewOrigin"
        anchor:
          $ref: "#/components/schemas/CommentAnchor"
        carriedFrom:
          $ref: "#/components/schemas/CommentCarriedFrom"
        placement:
          $ref: "#/components/schemas/CommentPlacement"
    AgentReviewComment:
      type: object
      additionalProperties: false
      if:
        required: [target]
        properties:
          target:
            const: file
      then:
        properties:
          side:
            const: additions
          start:
            const: 0
          end:
            const: 0
        anyOf:
          - required: [carriedFrom]
          - properties:
              code:
                const: ""
      else:
        not:
          required: [carriedFrom]
        properties:
          start:
            minimum: 1
          end:
            minimum: 1
      required:
        [
          id,
          diffId,
          versionId,
          path,
          scope,
          fingerprint,
          side,
          start,
          end,
          code,
          body,
          status,
          createdAt,
          applicability,
          actionable,
        ]
      properties:
        id:
          type: string
        diffId:
          type: string
        versionId:
          type: string
        path:
          type: string
        scope:
          $ref: "#/components/schemas/DiffMode"
        fingerprint:
          type: string
        target:
          type: string
          enum: [file, lines]
          description: Omitted means a line comment. File comments use additions, zero start/end, and empty code unless carried from an earlier line selection.
        side:
          type: string
          enum: [additions, deletions]
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        code:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [open, resolved]
        createdAt:
          type: number
        origin:
          $ref: "#/components/schemas/ReviewOrigin"
        anchor:
          $ref: "#/components/schemas/CommentAnchor"
        carriedFrom:
          $ref: "#/components/schemas/CommentCarriedFrom"
        placement:
          $ref: "#/components/schemas/CommentPlacement"
        applicability:
          $ref: "#/components/schemas/CommentApplicability"
        actionable:
          type: boolean
    CommentApplicability:
      type: string
      enum: [anchored, moved, outdated, unchanged, other-scope, unknown]
      description: >-
        Where a stream comment applies in the viewed snapshot. anchored and moved
        render inline; outdated means the commented code changed or its file left
        the diff; unchanged means the code still exists but is no longer changed;
        other-scope means the comment belongs to another scope; unknown means the
        snapshot cannot be compared.
    CommentPlacement:
      type: object
      additionalProperties: false
      required: [applicability, side, start, end]
      description: Server-computed position of a comment in the viewed snapshot. Ignored on import.
      properties:
        applicability:
          $ref: "#/components/schemas/CommentApplicability"
        side:
          type: string
          enum: [additions, deletions]
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    CommentAnchor:
      type: object
      additionalProperties: false
      required: [before, after]
      description: Same-side lines around the commented code, captured by the server when the comment is created and used to re-anchor it in later snapshots.
      properties:
        before:
          type: string
        after:
          type: string
    CommentCarriedFrom:
      type: object
      additionalProperties: false
      required: [versionId, side, start, end]
      description: Original line selection of an outdated comment kept open at file level.
      properties:
        versionId:
          type: string
        side:
          type: string
          enum: [additions, deletions]
        start:
          type: integer
          minimum: 1
        end:
          type: integer
          minimum: 1
    ResolveReviewComment:
      type: object
      additionalProperties: false
      required: [comment_id, status]
      properties:
        comment_id:
          type: string
        status:
          type: string
          enum: [resolved]
    CreateComment:
      type: object
      additionalProperties: false
      if:
        required: [target]
        properties:
          target:
            const: file
      then:
        properties:
          side:
            const: additions
          start:
            const: 0
          end:
            const: 0
          code:
            const: ""
      else:
        properties:
          start:
            minimum: 1
          end:
            minimum: 1
      required:
        [diffId, versionId, fileId, scope, fileVersion, side, start, end, body]
      properties:
