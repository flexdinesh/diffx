# Original Session.capabilities schema before the named-component extraction.
type: object
additionalProperties: false
required: [diff, files, review]
properties:
  diff:
    type: object
    additionalProperties: false
    required: [scopes, refresh, stagingMetadata]
    properties:
      scopes:
        $ref: "#/components/schemas/ScopesCapability"
      refresh:
        $ref: "#/components/schemas/Capability"
      stagingMetadata:
        $ref: "#/components/schemas/Capability"
  files:
    type: object
    additionalProperties: false
    required: [contents]
    properties:
      contents:
        $ref: "#/components/schemas/Capability"
  review:
    type: object
    additionalProperties: false
    required: [comments]
    properties:
      comments:
        $ref: "#/components/schemas/Capability"
