# Publishes diffx-server, diffx-fetcher and diffx-console images for main commits to the
# homelab registry and rolls deehomelab/k8s-cluster apps/diffx diffx-staging. promote.yml
# deploys these images to diffx-prod. Verification stays in explicit local PR validation.
when:
  - event: push
    branch: main
  # Rebuild staging from the Woodpecker UI without a push.
  - event: manual
    branch: main

steps:
  build-web:
    image: docker.io/library/node:26.5.0-bookworm-slim
    environment:
      HUSKY: "0"
    commands:
      - npm install --global pnpm@11.25.0
      - pnpm install --frozen-lockfile
      - pnpm build

  stage-web:
    image: docker.io/library/golang:1.27.3-bookworm
    environment:
      GOTOOLCHAIN: local
    commands:
      - go run ./tools/stage-web apps/web/dist internal/webui/dist
      - go run ./tools/stage-web apps/console/dist internal/consoleui/dist

  deploy:
    image: docker.io/library/docker:29.9.2-cli
    environment:
      REGISTRY: registry.local.deebox.xyz/home
      KUBECONFIG_CONTENT:
        from_secret: KUBECONFIG
      KUBECONFIG: /tmp/kubeconfig
      KUBECTL_VERSION: v1.35.9
    commands:
      - sh scripts/ci/deploy.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

concurrency: 1
