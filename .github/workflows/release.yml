name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  HUSKY: 0

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.6

      - name: Cache dependencies and Go builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-dependencies-${{ hashFiles('mise.toml', '.node-version', 'package.json', 'pnpm-lock.yaml', 'go.sum') }}
          restore-keys: ${{ runner.os }}-dependencies-

      - name: Install dependencies
        run: mise run deps

      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:select-version

      - name: Create release tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: mise run release:tag

      - name: Stage embedded web assets
        if: steps.version.outputs.release_exists != 'true'
        run: mise run web:stage

      - name: Publish GitHub release
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DIFFX_SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: mise run release:publish

  desktop:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      source: ${{ needs.release.outputs.source }}
