name: Edge

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: edge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-dependencies-${{ hashFiles('mise.toml', '.node-version', 'package.json', 'pnpm-lock.yaml', 'go.sum') }}
          restore-keys: ${{ runner.os }}-dependencies-
      - run: mise run deps
      - run: mise run web:stage
      - run: mise run release:edge
        env:
          GH_TOKEN: ${{ github.token }}
