min_version = "2026.8.6"

[settings]
# Reuse .node-version and package.json's packageManager pin.
idiomatic_version_file_enable_tools = ["node", "pnpm"]
# Record tool checksums in mise.lock; CI installs with --locked.
lockfile = true
# Checkouts and rebases rewrite mtimes; compare task sources by content.
task.source_freshness_hash_contents = true

[env]
# Use the mise Go pin; never download a toolchain go.mod asks for.
GOTOOLCHAIN = "local"
# Never let a Dagger bootstrap remove another repository's engine.
DAGGER_LEAVE_OLD_ENGINE = "true"

[tools]
go = "1.27.3"
"aqua:sqlc-dev/sqlc" = "1.31.1"

[tasks.deps]
description = "Install pnpm dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.setup]
description = "Install dependencies, hooks, Playwright Chromium, and embedded web assets"
run = [
  { task = "deps" },
  "pnpm prepare",
  "pnpm test:browser:install",
  { task = "web:stage" },
  { task = "console:stage" },
]

[tasks.generate]
description = "Generate TypeScript API types, Postgres queries and agent plugin adapters"
run = [
  "pnpm generate:api",
  { task = "generate:sql" },
  { task = "plugins:build" },
]

[tasks."generate:sql"]
description = "Generate typed Go Postgres queries from internal/pgstore SQL"
run = "sqlc generate -f internal/pgstore/sqlc.yaml"

[tasks."web:build"]
description = "Generate API types and build the web app and console"
sources = [
  "apps/web/src/**/*",
  "apps/web/public/**/*",
  "apps/web/index.html",
  "apps/web/vite.config.ts",
  "apps/web/tsconfig.json",
  "apps/web/package.json",
  "apps/console/src/**/*",
  "apps/console/public/**/*",
  "apps/console/index.html",
  "apps/console/vite.config.ts",
  "apps/console/tsconfig.json",
  "apps/console/package.json",
  "packages/ui/src/**/*",
  "packages/ui/tsconfig.json",
  "packages/ui/components.json",
  "packages/ui/package.json",
  "packages/api/openapi.yaml",
  "packages/api/src/**/*",
  "packages/api/package.json",
  "packages/console-api/openapi.yaml",
  "packages/console-api/src/**/*",
  "packages/console-api/package.json",
  "package.json",
  "pnpm-lock.yaml",
]
outputs = [
  "apps/web/dist/**/*",
  "apps/console/dist/**/*",
  "packages/api/src/schema.d.ts",
  "packages/console-api/src/schema.d.ts",
]
run = "pnpm build"

[tasks."web:stage"]
description = "Build and stage ignored embedded web assets for Go builds"
depends = ["web:build"]
sources = ["apps/web/dist/**/*", "tools/stage-web/**/*"]
outputs = ["internal/webui/dist/**/*"]
run = "go run ./tools/stage-web apps/web/dist internal/webui/dist"

[tasks."console:stage"]
description = "Build and stage ignored embedded console assets for Go builds"
depends = ["web:build"]
sources = ["apps/console/dist/**/*", "tools/stage-web/**/*"]
outputs = ["internal/consoleui/dist/**/*"]
run = "go run ./tools/stage-web apps/console/dist internal/consoleui/dist"

[tasks.build]
description = "Build the standalone CLI at dist/diffx, diffx-server and diffx-console"
depends = ["web:stage", "console:stage"]
sources = [
  "cmd/**/*",
  "internal/**/*",
  "packages/api/*.go",
  "packages/api/openapi.yaml",
  "packages/console-api/*.go",
  "packages/console-api/openapi.yaml",
  "go.mod",
  "go.sum",
]
outputs = ["dist/diffx", "dist/diffx-server", "dist/diffx-console"]
run = [
  "node -e \"require('node:fs').mkdirSync('dist', { recursive: true })\"",
  "go build -trimpath -o dist/diffx ./cmd/diffx",
  "go build -trimpath -o dist/diffx-server ./cmd/diffx-server",
  "go build -trimpath -o dist/diffx-console ./cmd/diffx-console",
]

[tasks.install]
description = "Build and install the CLI"
depends = ["build"]
run = "go install -trimpath ./cmd/diffx"

[tasks.dev]
description = "Start Vite HMR and its managed Go fixture server"
alias = "dev:web"
run = "pnpm dev:web"

[tasks."dev:console"]
description = "Run diffx-console on the development Postgres behind Vite HMR"
depends = ["db:up", "console:stage"]
shell = "bash -e -o pipefail -c"
# The setup link and cookies use Vite's origin; Vite proxies the API to the console.
# Invite and member reset links open the app from mise run dev:remote.
run = '''
export DIFFX_CONSOLE_DATABASE_URL="${DIFFX_CONSOLE_DATABASE_URL:-postgres://diffx:diffx@127.0.0.1:${DIFFX_DEV_POSTGRES_PORT:-54329}/diffx?sslmode=disable}"
export DIFFX_CONSOLE_INSECURE_COOKIES=true
export DIFFX_CONSOLE_PUBLIC_URL="${DIFFX_CONSOLE_PUBLIC_URL:-http://localhost:5174}"
export DIFFX_CONSOLE_APP_URL="${DIFFX_CONSOLE_APP_URL:-http://localhost:5173}"
DIFFX_CONSOLE_PORT=7970 go run ./cmd/diffx-console &
console=$!
trap 'kill "$console" 2>/dev/null; wait "$console" 2>/dev/null' EXIT
DIFFX_CONSOLE_URL=http://127.0.0.1:7970 pnpm dev:console --port 5174 --strictPort
'''

[tasks."plugins:build"]
description = "Build self-contained agent plugin adapters"
sources = [
  "packages/plugin-*/src/**/*",
  "packages/plugin-*/tsconfig*.json",
  "packages/plugin-*/package.json",
  "tsconfig.json",
  "pnpm-lock.yaml",
]
outputs = ["packages/plugin-opencode/dist/**/*", "packages/plugin-pi/dist/**/*"]
run = "pnpm --recursive --filter '@diffx/plugin-*' --if-present build"

[tasks."docs:dev"]
description = "Serve the docs website with live reload at localhost:5173"
run = "pnpm --filter @diffx/docs dev"

[tasks."docs:build"]
description = "Build and validate the static docs website at docs-website/dist/public"
alias = "docs:check"
# Skipped when the docs inputs are unchanged since the last build.
sources = [
  "docs-website/src/**/*",
  "docs-website/vocs.config.ts",
  "docs-website/package.json",
  "pnpm-lock.yaml",
]
outputs = ["docs-website/dist/public/**/*"]
run = "pnpm --filter @diffx/docs build"

[tasks."dev:server"]
description = "Start a standalone Go fixture server"
depends = ["web:build"]
run = "go run ./cmd/diffx dev --fixture test/fixtures/sample.diff --state memory --web-dir apps/web/dist"

[tasks."db:up"]
description = "Start the development Postgres (compose.dev.yml) and wait until healthy"
run = "docker compose -f compose.dev.yml up -d --wait"

[tasks."db:down"]
description = "Stop the development Postgres, preserving its data"
run = "docker compose -f compose.dev.yml down"

[tasks."db:reset"]
description = "Delete the development Postgres data and start it fresh"
run = [
  "docker compose -f compose.dev.yml down --volumes",
  "docker compose -f compose.dev.yml up -d --wait",
]

[tasks."dev:remote"]
description = "Run diffx-server on the development Postgres behind Vite HMR"
depends = ["db:up", "web:stage"]
shell = "bash -e -o pipefail -c"
# The setup link and cookies use Vite's origin; Vite proxies the API to the server.
run = '''
export DIFFX_SERVER_DATABASE_URL="${DIFFX_SERVER_DATABASE_URL:-postgres://diffx:diffx@127.0.0.1:${DIFFX_DEV_POSTGRES_PORT:-54329}/diffx?sslmode=disable}"
export DIFFX_SERVER_INSECURE_COOKIES=true
export DIFFX_SERVER_PUBLIC_URL="${DIFFX_SERVER_PUBLIC_URL:-http://localhost:5173}"
go run ./cmd/diffx-server --listen 127.0.0.1:7980 &
server=$!
trap 'kill "$server" 2>/dev/null; wait "$server" 2>/dev/null' EXIT
DIFFX_API_URL=http://127.0.0.1:7980 pnpm dev:web
'''

[tasks."test:go"]
description = "Run isolated Go tests and vet"
run = [{ task = "check:go" }]

[tasks."test:race"]
description = "Run isolated Go race tests and vet"
run = [{ task = "check:go" }]

[tasks."test:exec:go"]
description = "Internal Go tests; use test:go for isolation"
hide = true
run = "go test -timeout 3m ./..."

[tasks."test:exec:race"]
description = "Internal Go race tests; use test:race for isolation"
hide = true
run = "go test -race -timeout 5m ./..."

[tasks."test:conformance"]
description = "Run isolated API conformance tests"
run = [{ task = "check:conformance" }]

[tasks."check:exec:static"]
description = "Check TypeScript, JavaScript lint, and formatting"
hide = true
run = ["mise tasks validate", "pnpm check:exec:static"]

[tasks."check:exec:go:static"]
description = "Check Go formatting and vet"
hide = true
run = [{ task = "check:format:go" }, "go vet ./..."]

[tasks."check:format:go"]
description = "Verify Go formatting on the host"
shell = "bash -e -o pipefail -c"
run = '''
unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted"
  exit 1
fi
'''

[tasks."check:js"]
description = "Run host static checks and isolated JavaScript suites"
run = [
  { task = "check:static" },
  { task = "check:unit" },
  { task = "check:browser" },
  { task = "check:release" },
]

[tasks."check:exec:generated"]
description = "Reject uncommitted generated API types, Postgres queries and plugins"
hide = true
shell = "bash -e -o pipefail -c"
run = '''
if ! sqlc diff -f internal/pgstore/sqlc.yaml; then
  echo 'Run `mise run generate:sql` and commit internal/pgstore/pgdb.' >&2
  exit 1
fi
generated_changes=$(git status --porcelain --untracked-files=all -- packages/api/src/schema.d.ts packages/console-api/src/schema.d.ts packages/plugin-opencode/dist packages/plugin-pi/dist)
if [ -n "$generated_changes" ]; then
  printf '%s\n' "$generated_changes"
  echo 'Commit generated API types and built plugins before pushing.' >&2
  exit 1
fi
'''

[tasks."check:ci"]
description = "Lightweight CI: build, static checks, generated drift, API smoke test"
run = [
  { task = "build" },
  { task = "plugins:build" },
  { tasks = [
    "check:exec:static",
    "check:exec:go:static",
  ] },
  { task = "check:exec:generated" },
  "pnpm test:exec:conformance",
]

[tasks."test:js"]
description = "Run JavaScript unit and browser suites"
run = [{ task = "check:unit" }, { task = "check:browser" }]

[tasks."test:release"]
description = "Run release-tool tests"
run = [{ task = "check:release" }]

[tasks.check]
description = "Run host static checks and isolated tests against working files"
tools = { "aqua:dagger/dagger" = "0.21.11" }
shell = "bash -e -o pipefail -c"
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner check"

[tasks."test:contracts"]
description = "Build and run architecture, boundary, shared-rule, Go and real HTTP contracts"
run = [
  { task = "check:boundaries" },
  { task = "check:design" },
  { task = "test:contracts:rules" },
  { task = "test:go" },
  { task = "check:conformance" },
]

[tasks."check:boundaries"]
description = "Reject unclassified packages and forbidden production dependencies"
run = "go run ./tools/check-boundaries"

[tasks."check:design"]
description = "Check frontend design-token use"
run = "node tools/check-design.ts"

[tasks."test:contracts:rules"]
description = "Run isolated shared-rule contract tests"
run = [{ task = "check:contracts" }]

[tasks."check:exec:contracts"]
description = "Internal shared-rule contract tests"
hide = true
run = "node --test --test-reporter=dot test/contracts/*.test.ts"

[tasks."check:pr"]
description = "Validate clean committed HEAD before creating or updating a PR"
alias = "check:push"
tools = { "aqua:dagger/dagger" = "0.21.11" }
shell = "bash -e -o pipefail -c"
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner pr"

[tasks."check:status"]
description = "Report matching validation records for committed HEAD"
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner status"

[tasks."check:engine:setup"]
description = "Explicitly provision the owned diffx validation engine"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner engine-setup"

[tasks."check:static"]
description = "Run static checks on a private host snapshot; no Docker required"
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group static"

[tasks."check:go"]
description = "Run Go tests in an isolated snapshot"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group go"

[tasks."check:contracts"]
description = "Run architecture and shared-rule contracts in isolation"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group contracts"

[tasks."check:unit"]
description = "Run JavaScript unit, DOM and plugin tests in isolation"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group unit"

[tasks."check:browser"]
description = "Run web and console browser tests in isolation"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group browser"

[tasks."check:conformance"]
description = "Run API conformance tests in isolation"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group conformance"

[tasks."check:docs"]
description = "Build and check the docs site in isolation"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group docs"

[tasks."check:release"]
description = "Run release-tool tests in isolation"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group release"

[tasks."check:generated"]
description = "Regenerate and check API, SQL and plugin outputs in isolation"
tools = { "aqua:dagger/dagger" = "0.21.11" }
run = "GOMAXPROCS=2 GOFLAGS='-p=2' go run ./tools/check-runner group generated"

[tasks."release:publish"]
description = "Publish the checked-out release tag with GoReleaser"
tools = { "aqua:goreleaser/goreleaser" = "2.18.2" }
shell = "bash -e -o pipefail -c"
run = '''
: "${RELEASE_TAG:?RELEASE_TAG is required}"
# Release commits are off main, so Git describe cannot find the previous release.
previous_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | awk -v tag="$RELEASE_TAG" 'found && !previous { previous = $0 } $0 == tag { found = 1 } END { print previous }')
export GORELEASER_CURRENT_TAG="$RELEASE_TAG"
if [ -n "$previous_tag" ]; then
  export GORELEASER_PREVIOUS_TAG="$previous_tag"
fi
goreleaser release --clean
'''

[tasks."release:homebrew:check"]
description = "Validate the generated Homebrew formula syntax"
run = "ruby -c homebrew-tap/Formula/diffx.rb"


[tasks."docker:build"]
description = "Build the remote server image with staged embedded assets"
depends = ["web:stage", "console:stage"]
run = "docker build --tag diffx-server:local ."

[tasks."docker:up"]
description = "Build and start the server and console with their bundled persistent Postgres"
depends = ["web:stage", "console:stage"]
run = "docker compose up --build -d"

[tasks."docker:down"]
description = "Stop the server, preserving its data volume"
run = "docker compose down"
