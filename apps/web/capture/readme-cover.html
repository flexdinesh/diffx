<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Dev-only page the README cover recorder films; never a build input. -->
    <script>
      document.documentElement.dataset.theme =
        new URLSearchParams(location.search).get("theme") === "dark"
          ? "dark"
          : "light";
    </script>
    <title>diffx README cover</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/capture/readme-cover.tsx"></script>
  </body>
</html>
