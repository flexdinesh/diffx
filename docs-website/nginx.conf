# Mirrors wrangler.jsonc: route paths resolve to <path>/index.html or
# <path>.html, unknown paths serve 404.html with status 404.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind Caddy and Traefik: keep redirects relative to the public host.
    absolute_redirect off;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
