baseURL: http://localhost:1313/
locale: en-US
title: diffx
publishDir: dist

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Documentation
      pageRef: /
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      url: https://github.com/flexdinesh/diffx
      weight: 3
      params:
        icon: github

params:
  description: Review Git changes in your browser with diffx.
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    displayCopyright: false
    displayPoweredBy: true

markup:
  highlight:
    noClasses: false
