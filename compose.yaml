# A fixed project name keeps the data volume independent of the checkout directory.
name: diffx

services:
  server:
    build: .
    image: diffx-server:local
    environment:
      DIFFX_SERVER_HOST: 0.0.0.0
      DIFFX_SERVER_PORT: "7980"
      DIFFX_SERVER_STATE: /data/state.db
      DIFFX_SERVER_RETENTION_DAYS: "${DIFFX_SERVER_RETENTION_DAYS:-7}"
      # Supply both for the first account; no default credentials are generated.
      DIFFX_SERVER_USERNAME: "${DIFFX_SERVER_USERNAME:-}"
      DIFFX_SERVER_PASSWORD: "${DIFFX_SERVER_PASSWORD:-}"
      DIFFX_SERVER_SIGNUP_ENABLED: "${DIFFX_SERVER_SIGNUP_ENABLED:-false}"
      # Loopback HTTP development only. Use false behind production HTTPS.
      DIFFX_SERVER_INSECURE_COOKIES: "${DIFFX_SERVER_INSECURE_COOKIES:-true}"
    ports:
      # Only the published host port varies; local `diffx [PATH]` uses 7981-7990.
      - "127.0.0.1:${DIFFX_SERVER_PORT:-7980}:7980"
    volumes:
      - diffx-data:/data
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  diffx-data:
