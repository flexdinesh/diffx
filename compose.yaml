# A fixed project name keeps the database volume independent of the checkout directory.
name: diffx

services:
  server:
    build: .
    image: diffx-server:local
    environment:
      DIFFX_SERVER_HOST: 0.0.0.0
      DIFFX_SERVER_PORT: "7980"
      # The server is stateless; replicas share this database. Point it at your
      # own Postgres 18+ to drop the bundled service.
      DIFFX_SERVER_DATABASE_URL: "${DIFFX_SERVER_DATABASE_URL:-postgres://diffx:${DIFFX_POSTGRES_PASSWORD:-diffx}@postgres:5432/diffx?sslmode=disable}"
      DIFFX_SERVER_RETENTION_DAYS: "${DIFFX_SERVER_RETENTION_DAYS:-7}"
      # Until the admin exists, each start logs a one-time setup link on this
      # origin; no default credentials are generated.
      DIFFX_SERVER_PUBLIC_URL: "${DIFFX_SERVER_PUBLIC_URL:-}"
      # Google sign-in for invited accounts: set both (empty runs admin-only).
      # Needs DIFFX_SERVER_PUBLIC_URL for the callback.
      DIFFX_SERVER_GOOGLE_CLIENT_ID: "${DIFFX_SERVER_GOOGLE_CLIENT_ID:-}"
      DIFFX_SERVER_GOOGLE_CLIENT_SECRET: "${DIFFX_SERVER_GOOGLE_CLIENT_SECRET:-}"
      # Loopback HTTP development only. Use false behind production HTTPS.
      DIFFX_SERVER_INSECURE_COOKIES: "${DIFFX_SERVER_INSECURE_COOKIES:-true}"
      # GitHub App integration: set all or none (empty disables it), then start
      # with `--profile github`. Mount the private key read-only in an override
      # file and point PRIVATE_KEY_FILE at it.
      DIFFX_SERVER_GITHUB_APP_ID: "${DIFFX_SERVER_GITHUB_APP_ID:-}"
      DIFFX_SERVER_GITHUB_CLIENT_ID: "${DIFFX_SERVER_GITHUB_CLIENT_ID:-}"
      DIFFX_SERVER_GITHUB_PRIVATE_KEY_FILE: "${DIFFX_SERVER_GITHUB_PRIVATE_KEY_FILE:-}"
      DIFFX_SERVER_GITHUB_PUBLIC_URL: "${DIFFX_SERVER_GITHUB_PUBLIC_URL:-}"
      DIFFX_SERVER_GITHUB_CLIENT_SECRET: "${DIFFX_SERVER_GITHUB_CLIENT_SECRET:-}"
      DIFFX_SERVER_GITHUB_WEBHOOK_SECRET: "${DIFFX_SERVER_GITHUB_WEBHOOK_SECRET:-}"
      DIFFX_SERVER_GITHUB_TOKEN_KEY: "${DIFFX_SERVER_GITHUB_TOKEN_KEY:-}"
      # The fetcher listener (internal port 7979) is reachable only on the fetch
      # network; never publish it.
      DIFFX_SERVER_FETCHER_SECRET: "${DIFFX_SERVER_FETCHER_SECRET:-}"
    ports:
      # Only the published host port varies; local `diffx [PATH]` uses 7981-7990.
      - "127.0.0.1:${DIFFX_SERVER_PORT:-7980}:7980"
    networks:
      - default
      - fetch
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s

  # Self-host example database; it is never published. Production operators
  # usually run their own Postgres and set DIFFX_SERVER_DATABASE_URL instead.
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: diffx
      POSTGRES_PASSWORD: "${DIFFX_POSTGRES_PASSWORD:-diffx}"
      POSTGRES_DB: diffx
    volumes:
      - diffx-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffx -d diffx"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Mirrors leased pull requests from GitHub; it has no published ports.
  fetcher:
    profiles: ["github"]
    build:
      context: .
      target: fetcher
    image: diffx-fetcher:local
    environment:
      DIFFX_FETCHER_SERVER_URL: http://server:7979
      DIFFX_FETCHER_SECRET: "${DIFFX_SERVER_FETCHER_SECRET:-}"
      DIFFX_FETCHER_DISK_LIMIT_GB: "${DIFFX_FETCHER_DISK_LIMIT_GB:-20}"
      DIFFX_FETCHER_CONCURRENCY: "${DIFFX_FETCHER_CONCURRENCY:-2}"
    networks:
      - fetch
    volumes:
      - diffx-mirrors:/mirrors
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      - server
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  # Shared by server and fetcher only; the fetcher also reaches GitHub through it.
  fetch:

volumes:
  diffx-postgres:
  diffx-mirrors:
