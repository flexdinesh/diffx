version: 2
project_name: diffx

snapshot:
  version_template: "{{ .Env.DIFFX_RELEASE_VERSION }}"

release:
  prerelease: false
  make_latest: true

builds:
  - &diffx
    id: diffx
    main: ./cmd/diffx
    binary: diffx
    env:
      - CGO_ENABLED=0
    ldflags:
      - >-
        -s -w
        -X github.com/flexdinesh/diffx/internal/version.Version={{.Version}}
        -X github.com/flexdinesh/diffx/internal/version.Commit={{.Env.DIFFX_SOURCE_SHA}}
        -X github.com/flexdinesh/diffx/internal/version.Date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore: &macos-intel
      - goos: darwin
        goarch: amd64
  - &diffx-server
    id: diffx-server
    main: ./cmd/diffx-server
    binary: diffx-server
    env:
      - CGO_ENABLED=0
    ldflags:
      - >-
        -s -w
        -X github.com/flexdinesh/diffx/internal/version.Version={{.Version}}
        -X github.com/flexdinesh/diffx/internal/version.Commit={{.Env.DIFFX_SOURCE_SHA}}
        -X github.com/flexdinesh/diffx/internal/version.Date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore: *macos-intel
  # Stable only: `ignore` is not templated, so macOS Intel needs its own builds.
  - <<: *diffx
    id: diffx-darwin-amd64
    goos: [darwin]
    goarch: [amd64]
    ignore: []
    skip: '{{ eq .Env.DIFFX_RELEASE_VERSION "edge" }}'
  - <<: *diffx-server
    id: diffx-server-darwin-amd64
    goos: [darwin]
    goarch: [amd64]
    ignore: []
    skip: '{{ eq .Env.DIFFX_RELEASE_VERSION "edge" }}'

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
